name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # 注意：pnpm 11 要求 Node >= 22.13。若这里给 20，setup-node 的 cache: pnpm
      # 预热会跑 `pnpm store path`，pnpm 11 加载 node:sqlite 直接崩
      # （ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite）。
      # 产物仍用 esbuild --target=node20，运行期兼容 Node 20。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（4 个包）
        # mcp / gateway 从 @yisang0910/core 的 dist/*.d.ts 取类型，所以根脚本
        # typecheck 会先 build:core 再 pnpm -r typecheck（干净 checkout 也能过）。
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 单测（TypeScript、原生通道与机器人反馈）
        run: pnpm test

      - name: 网关脚本单测（不连飞书）
        run: node scripts/test-gateway.mjs

      - name: 打包冒烟（确认 bundle 能产出）
        run: |
          pnpm build:single
          node --check dist-single/dsh-feishu-mcp.mjs
          pnpm exec esbuild packages/gateway/src/index.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --external:@larksuiteoapi/node-sdk \
            --external:bufferutil --external:utf-8-validate \
            --outfile=dist-single/gateway-thin.mjs --log-level=warning
          node --check dist-single/gateway-thin.mjs

# 注意：scripts/smoke.mjs 需要真实飞书凭据，CI 里不跑。
# 本地验证用：pnpm smoke / pnpm smoke:write

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建镜像
        run: docker build -t dsh-feishu-mcp:ci .

      # 目录站与客户端做 introspection 时都不会带凭据：不配 FEISHU_APP_ID
      # 也必须能握手、能 tools/list，只有真正调用工具才报配置错误。
      - name: 无凭据启动冒烟
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run --rm -i dsh-feishu-mcp:ci > out.jsonl
          node -e "
            const lines = require('node:fs').readFileSync('out.jsonl','utf8').trim().split('\n').map(JSON.parse);
            const init = lines.find(l => l.id === 1);
            const list = lines.find(l => l.id === 2);
            if (!init?.result?.serverInfo) throw new Error('initialize 没有返回 serverInfo');
            const n = list?.result?.tools?.length ?? 0;
            if (n < 30) throw new Error('tools/list 只拿到 ' + n + ' 个工具');
            console.log('initialize ok, tools=' + n);
          "
