<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="dsh-feishu">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#2547C9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0B1F5C" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#lg)" filter="url(#sh)"/>
  <rect width="256" height="128" rx="58" fill="url(#gloss)"/>

  <!-- 实心气泡，尾巴挂在底边左侧 -->
  <path d="M74,67 h108 a20,20 0 0 1 20,20 v56 a20,20 0 0 1 -20,20 h-58 l-24,30 v-30 h-26 a20,20 0 0 1 -20,-20 v-56 a20,20 0 0 1 20,-20 z"
        fill="#FFFFFF"/>

  <!-- 终端提示符 -->
  <path d="M93,93 l23,22 -23,22" fill="none" stroke="#2F55D4" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标 -->
  <rect x="128" y="109" width="35" height="12" rx="6" fill="#2F55D4"/>
</svg>
